<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4cf3e8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#4cf3e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4cf3e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a66cff"/>
      <stop offset="100%" stop-color="#4cf3e8"/>
    </linearGradient>
  </defs>

  <!-- Void background, rounded to sit well as an app icon -->
  <rect width="64" height="64" rx="14" fill="#0b0e14"/>

  <!-- Ambient glow, echoing the sidebar's pulse rail -->
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- Orbit ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#core)" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Core pulse — the same mark used beside "NOVA" in the sidebar -->
  <circle cx="32" cy="32" r="7.5" fill="url(#core)"/>

  <!-- Orbiting node -->
  <circle cx="32" cy="15" r="3.5" fill="#4cf3e8"/>
</svg>
